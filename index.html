<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetMed Connect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    html { scroll-behavior: smooth; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

  <div class="flex flex-col md:flex-row h-screen overflow-hidden">
    
    <div class="md:hidden w-full bg-slate-900 p-4 flex items-center justify-between z-50 shadow-md">
      <div class="flex items-center gap-2">
        <div class="bg-blue-500 p-1.5 rounded-lg text-white">
          <i data-lucide="heart-pulse" class="w-4 h-4"></i>
        </div>
        <h1 class="text-lg font-bold text-white tracking-wide">PetMed</h1>
      </div>
      <div class="relative w-48">
        <select class="petSwitcher w-full p-2 pl-8 bg-slate-800 text-white text-sm rounded-xl border border-slate-700 appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer" onchange="app.switchPet(this.value)"></select>
        <i data-lucide="dog" class="w-4 h-4 absolute left-2 top-2.5 text-blue-400 pointer-events-none"></i>
        <i data-lucide="chevron-down" class="w-3 h-3 absolute right-3 top-3 text-slate-400 pointer-events-none"></i>
      </div>
    </div>

    <nav class="fixed bottom-0 w-full bg-slate-900 text-slate-300 md:relative md:w-64 flex md:flex-col z-40 order-last md:order-first">
      <div class="p-6 hidden md:flex items-center gap-3">
        <div class="bg-blue-500 p-2 rounded-lg text-white">
          <i data-lucide="heart-pulse" class="w-5 h-5"></i>
        </div>
        <h1 class="text-xl font-bold text-white tracking-wide">PetMed Connect</h1>
      </div>
      
      <div class="px-6 pb-6 hidden md:block">
        <div class="relative">
          <select class="petSwitcher w-full p-3 pl-10 bg-slate-800 text-white rounded-xl border border-slate-700 appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer" onchange="app.switchPet(this.value)"></select>
          <i data-lucide="dog" class="w-5 h-5 absolute left-3 top-3.5 text-blue-400 pointer-events-none"></i>
          <i data-lucide="chevron-down" class="w-4 h-4 absolute right-4 top-4 text-slate-400 pointer-events-none"></i>
        </div>
      </div>

      <ul class="flex md:flex-col w-full justify-around md:justify-start flex-1 px-2 md:px-4 gap-1 pb-2 md:pb-0" id="navLinks">
        </ul>
      <div class="hidden md:block p-4 text-xs text-slate-600">v1.18.0 (Health Analytics & KPI)</div>
    </nav>

    <main class="flex-1 h-full overflow-y-auto p-4 md:p-10 relative" id="mainContent">
      </main>
  </div>

  <script>
    const externalDB = [
      { barcode: "8595602508167", name: "Canvit Chondro Maxi", type: "medicine", recommended_dose: 1, unit: "tablet" },
      { barcode: "5407007851119", name: "Royal Canin Cavalier", type: "food", kcal_per_100g: 370 }
    ];

    const app = {
      qrScanner: null,
      chartInstanceWeight: null,
      chartInstanceCalorie: null,

      state: {
        activePetId: 1,
        selectedDate: new Date().toISOString().split('T')[0],
        deletingTask: null, 
        deletingPet: false, 
        editingTaskId: null, 
        cloningTaskData: null, 
        scanMode: null, 
        pets: [
          {
            id: 1,
            name: "Max",
            breed: "Border Collie",
            weight: 15.2,
            dailyKcal: 1024, 
            schedule: [
              { id: 101, name: "Poranny Posiłek", amount: 150, unit: "g", time: "08:00", type: "food", calories: 550, completed: false, completedDates: [], exclusions: [], frequency: "daily", startDate: new Date().toISOString().split('T')[0], autoDispense: true, hopperId: 1 },
              { id: 102, name: "Poranne Witaminy", amount: 1, unit: "szt.", time: "08:00", type: "medicine", calories: 0, completed: false, completedDates: [], exclusions: [], frequency: "daily", startDate: new Date().toISOString().split('T')[0], autoDispense: true, hopperId: 2 }
            ],
            savedProducts: [
              { name: "Royal Canin Cavalier", type: "food", amount: 150, unit: "g", calories: 550 },
              { name: "Canvit Chondro Maxi", type: "medicine", amount: 1, unit: "szt.", calories: 0 }
            ],
            weightHistory: [
              { date: '2025-10-01', weight: 14.0 },
              { date: '2025-12-15', weight: 14.5 },
              { date: '2026-02-10', weight: 15.0 },
              { date: '2026-05-01', weight: 15.2 }
            ],
            dispenseHistory: [],
            feeder: {
              status: 'online', 
              hoppers: [
                { id: 1, name: 'Główna Karma', capacity: 2000, current: 1540, type: 'food', unit: 'g' },
                { id: 2, name: 'Leki i Witaminy', capacity: 100, current: 12, type: 'medicine', unit: 'szt.' } 
              ]
            }
          }
        ],
        currentView: 'dashboard',
        pendingProduct: null 
      },

      init() {
        this.loadState();
        this.renderPetSwitcher();
        this.renderNav();
        this.navigate('dashboard');
      },

      loadState() {
        const saved = localStorage.getItem('petMedState_Final_V28'); 
        if (saved) this.state = JSON.parse(saved);
        if (!this.state.selectedDate) this.state.selectedDate = new Date().toISOString().split('T')[0];
        this.state.pets.forEach(p => { 
          if(!p.dispenseHistory) p.dispenseHistory = []; 
          if(!p.savedProducts) p.savedProducts = []; 
        });
      },

      saveState() {
        localStorage.setItem('petMedState_Final_V28', JSON.stringify(this.state));
        this.renderPetSwitcher(); 
        this.renderView(); 
      },

      emergencyStop() {
        const pet = this.getActivePet();
        pet.feeder.status = 'offline';
        const dzisiaj = new Date().toISOString().split('T')[0];
        const teraz = new Date().toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
        pet.dispenseHistory.unshift({ id: Date.now(), date: dzisiaj, time: teraz, amount: '---', hopperName: 'SYSTEM', status: 'error', message: 'STOP ALL triggered' });
        this.saveState();
        alert('SYSTEM EMERGENCY STOP: Dozownik został awaryjnie wyłączony!');
      },

      getActivePet() {
        return this.state.pets.find(p => p.id === parseInt(this.state.activePetId));
      },

      switchPet(id) {
        this.state.activePetId = parseInt(id); 
        this.state.deletingTask = null; 
        this.state.deletingPet = false; 
        this.state.editingTaskId = null;
        this.state.cloningTaskData = null;
        this.state.pendingProduct = null;
        this.stopCameraScan(); 
        this.saveState();
      },

      navigate(view) {
        this.stopCameraScan(); 
        this.state.currentView = view;
        this.state.deletingTask = null; 
        this.state.deletingPet = false; 
        this.state.editingTaskId = null;
        this.state.cloningTaskData = null;
        this.state.pendingProduct = null;
        this.renderNav();
        this.renderView();

        if (view === 'health') {
          setTimeout(() => this.initChart(), 0);
        }
      },

      selectScheduleDate(dateStr) {
        this.state.selectedDate = dateStr;
        this.state.editingTaskId = null; 
        this.state.cloningTaskData = null;
        this.renderView();
      },

      changeWeek(offsetDays) {
        const currentDate = new Date(this.state.selectedDate || new Date().toISOString().split('T')[0]);
        currentDate.setDate(currentDate.getDate() + offsetDays);
        this.state.selectedDate = currentDate.toISOString().split('T')[0];
        this.state.editingTaskId = null;
        this.state.cloningTaskData = null;
        this.renderView();
      },

      getWeekDates(dateString) {
        const date = new Date(dateString);
        const day = date.getDay(); 
        const diffToMonday = date.getDate() - day + (day === 0 ? -6 : 1);
        const monday = new Date(date.setDate(diffToMonday));
        
        const week = [];
        for(let i = 0; i < 7; i++) {
          const d = new Date(monday);
          d.setDate(monday.getDate() + i);
          week.push(d.toISOString().split('T')[0]);
        }
        return week;
      },

      getTasksForDate(pet, dateStr) {
        const targetDate = new Date(dateStr);
        targetDate.setHours(0,0,0,0);

        return pet.schedule.filter(task => {
          if (task.exclusions && task.exclusions.includes(dateStr)) return false;

          const taskStart = new Date(task.startDate || task.id); 
          taskStart.setHours(0,0,0,0);

          if (task.endDate) {
            const taskEnd = new Date(task.endDate);
            taskEnd.setHours(0,0,0,0);
            if (targetDate > taskEnd) return false;
          }

          if (task.frequency === 'once') {
            return targetDate.getTime() === taskStart.getTime();
          } else if (task.frequency === 'daily') {
            return targetDate >= taskStart;
          } else if (task.frequency === 'weekly') {
            return targetDate >= taskStart && targetDate.getDay() === taskStart.getDay();
          }
          return true;
        }).sort((a, b) => a.time.localeCompare(b.time));
      },

      createNewPet() {
        const newId = Date.now();
        const today = new Date().toISOString().split('T')[0]; 
        const newPet = {
          id: newId,
          name: "Nowy Zwierzak",
          breed: "Mieszaniec",
          weight: 10,
          dailyKcal: this.calculateRER(10),
          schedule: [],
          savedProducts: [],
          weightHistory: [ { date: today, weight: 10 } ],
          dispenseHistory: [],
          feeder: { status: 'offline', hoppers: [ { id: 1, name: 'Główna Karma', capacity: 2000, current: 0, type: 'food', unit: 'g' }, { id: 2, name: 'Leki i Witaminy', capacity: 100, current: 0, type: 'medicine', unit: 'szt.' } ] }
        };
        this.state.pets.push(newPet);
        this.state.activePetId = newId;
        this.saveState();
      },

      promptDeletePet() {
        if (this.state.pets.length <= 1) return; 
        this.state.deletingPet = true;
        this.renderView();
      },

      cancelDeletePet() {
        this.state.deletingPet = false;
        this.renderView();
      },

      confirmDeletePet() {
        this.state.pets = this.state.pets.filter(p => p.id !== parseInt(this.state.activePetId));
        this.state.activePetId = this.state.pets[0].id; 
        this.state.deletingPet = false;
        this.saveState();
      },

      toggleFeederConnection() {
        const pet = this.getActivePet();
        pet.feeder.status = pet.feeder.status === 'online' ? 'offline' : 'online';
        setTimeout(() => { this.saveState(); }, 300);
      },

      manualDispense(hopperId, amount = 50) {
        const pet = this.getActivePet();
        
        const hopper = pet.feeder.hoppers.find(h => h.id === hopperId);
        const confirmMsg = `Czy na pewno chcesz wydać ${hopper ? hopper.name : 'porcję'}?`;
        if (!confirm(confirmMsg)) { return; }

        const dzisiaj = new Date().toISOString().split('T')[0];
        const teraz = new Date().toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
        
        if (!pet.dispenseHistory) pet.dispenseHistory = [];

        if (pet.feeder.status !== 'online') { 
          alert('Błąd: Dozownik jest offline.'); 
          pet.dispenseHistory.unshift({ id: Date.now(), date: dzisiaj, time: teraz, amount: '-', hopperName: 'Dozownik', status: 'error', message: 'Urządzenie offline', type: hopper ? hopper.type : 'unknown', calories: 0 });
          this.saveState();
          return; 
        }
        
        if (hopper) {
          const activeTask = pet.schedule.find(t => t.hopperId === hopperId && t.autoDispense);
          let dispenseAmount = amount;
          let calories = 0;

          if (hopper.type === 'medicine') {
             dispenseAmount = activeTask ? activeTask.amount : (Math.floor(pet.weight / 10) || 1);
          } else if (hopper.type === 'food') {
             const kcalPerUnit = activeTask ? (activeTask.calories / activeTask.amount) : (pet.dailyKcal / (pet.dailyKcal / 3.7)); 
             calories = Math.round(dispenseAmount * kcalPerUnit) || 0;
          }

          if (hopper.current >= dispenseAmount) { 
            hopper.current -= dispenseAmount; 
            pet.dispenseHistory.unshift({ id: Date.now(), date: dzisiaj, time: teraz, amount: `${dispenseAmount} ${hopper.unit}`, hopperName: hopper.name, status: 'success', type: hopper.type, calories: calories });
            this.saveState(); 
            alert(`Wydano pomyślnie! Ilość: ${dispenseAmount}${hopper.unit} z pojemnika ${hopper.name}.`);
          } else { 
            pet.dispenseHistory.unshift({ id: Date.now(), date: dzisiaj, time: teraz, amount: `${dispenseAmount} ${hopper.unit}`, hopperName: hopper.name, status: 'error', message: 'Brak zasobów w pojemniku', type: hopper.type, calories: 0 });
            this.saveState();
            alert(`Brak wystarczających zasobów w ${hopper.name}. Proszę uzupełnić!`); 
          }
        }
      },

      refillHopper(hopperId) {
        const pet = this.getActivePet();
        const hopper = pet.feeder.hoppers.find(h => h.id === hopperId);
        if (hopper) { hopper.current = hopper.capacity; this.saveState(); }
      },

      initChart() {
        const pet = this.getActivePet();
        
        // --- 1. WYKRES WAGI ---
        const ctxWeight = document.getElementById('weightChart');
        if (ctxWeight) {
          if (this.chartInstanceWeight) this.chartInstanceWeight.destroy();
          this.chartInstanceWeight = new Chart(ctxWeight, {
            type: 'line',
            data: {
              labels: pet.weightHistory.map(entry => entry.date),
              datasets: [{ label: 'Waga (kg)', data: pet.weightHistory.map(entry => entry.weight), borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', borderWidth: 3, pointBackgroundColor: '#ffffff', pointBorderColor: '#3b82f6', pointBorderWidth: 2, pointRadius: 5, fill: true, tension: 0.4 }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: false, grid: { borderDash: [5, 5] } }, x: { grid: { display: false } } } }
          });
        }

        // --- 2. WYKRES KALORII (KPI / INDUSTRY 4.0) ---
        const ctxCal = document.getElementById('calorieChart');
        if (ctxCal) {
          if (this.chartInstanceCalorie) this.chartInstanceCalorie.destroy();

          // Generowanie dat z ostatnich 7 dni dla osi X
          const dniTygodnia = ['Ndz', 'Pon', 'Wt', 'Śr', 'Czw', 'Pt', 'Sob'];
          const last7Dates = [...Array(7)].map((_, i) => {
              const d = new Date();
              d.setDate(d.getDate() - (6 - i));
              return d;
          });
          const labels = last7Dates.map(d => dniTygodnia[d.getDay()]);

          // SYMULACJA REALISTYCZNYCH DANYCH (na potrzeby prezentacji)
          let calData = [];
          
          // Spróbujmy wyciągnąć prawdziwe dane z historii dozowań jedzenia
          last7Dates.forEach(dateObj => {
              const dateStr = dateObj.toISOString().split('T')[0];
              const dayLogs = pet.dispenseHistory.filter(h => h.date === dateStr && h.status === 'success' && h.type === 'food');
              const dayKcal = dayLogs.reduce((sum, log) => sum + (log.calories || 0), 0);
              calData.push(dayKcal);
          });

          // Jeśli wykres jest pusty (bo nikt jeszcze nic nie wydał w prawdziwej aplikacji), 
          // generujemy mock-up pokazujący potęgę analityki, oscylujący wokół dailyKcal
          const totalLogged = calData.reduce((a,b)=>a+b, 0);
          if (totalLogged === 0) {
              calData = last7Dates.map((_, i) => {
                  // Celowe zróżnicowanie: kilka dni idealnych, jeden dzień przejedzenia, jeden niedojedzenia
                  if (i === 2) return pet.dailyKcal + 210; // Przejedzenie
                  if (i === 5) return pet.dailyKcal - 150; // Niedojedzenie
                  return pet.dailyKcal + (Math.random() * 40 - 20); // Normalnie +/- 20 kcal
              });
          }

          // Tworzymy wykres mieszany: Słupki (Zjedzone) + Linia (Cel)
          this.chartInstanceCalorie = new Chart(ctxCal, {
            type: 'bar',
            data: {
              labels: labels,
              datasets: [
                {
                  type: 'line',
                  label: 'Cel (Target)',
                  data: last7Dates.map(() => pet.dailyKcal),
                  borderColor: '#ef4444', // Czerwona linia celu
                  borderWidth: 2,
                  borderDash: [5, 5],
                  pointRadius: 0,
                  fill: false,
                  tension: 0
                },
                {
                  type: 'bar',
                  label: 'Spożyte (kcal)',
                  data: calData,
                  backgroundColor: calData.map(val => val > pet.dailyKcal * 1.1 ? '#f87171' : (val < pet.dailyKcal * 0.9 ? '#fbbf24' : '#3b82f6')),
                  borderRadius: 6,
                  borderWidth: 0
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: true, position: 'bottom', labels: { usePointStyle: true, boxWidth: 8 } } },
              scales: { y: { beginAtZero: true, grid: { borderDash: [5, 5] } }, x: { grid: { display: false } } }
            }
          });
        }
      },

      addWeightLog(e) {
        e.preventDefault();
        const pet = this.getActivePet();
        const dateInput = document.getElementById('logDate').value;
        const weightInput = parseFloat(document.getElementById('logWeight').value);
        const existingIndex = pet.weightHistory.findIndex(entry => entry.date === dateInput);
        if (existingIndex !== -1) { pet.weightHistory[existingIndex].weight = weightInput; } 
        else { pet.weightHistory.push({ date: dateInput, weight: weightInput }); }
        pet.weightHistory.sort((a, b) => new Date(a.date) - new Date(b.date));
        pet.weight = weightInput;
        pet.dailyKcal = Math.round(70 * Math.pow(weightInput, 0.75) * 1.2);
        this.saveState();
        alert('Waga została pomyślnie zaktualizowana!');
        setTimeout(() => this.initChart(), 0);
      },

      calculateRER(weight) { return (!weight || weight <= 0) ? 0 : Math.round(70 * Math.pow(weight, 0.75) * 1.2); },
      handleWeightChange(event) {
        const kcalInput = document.getElementById('profileKcal');
        if (kcalInput) { kcalInput.value = this.calculateRER(parseFloat(event.target.value)); kcalInput.classList.add('ring-2', 'ring-green-400', 'bg-green-50'); setTimeout(() => kcalInput.classList.remove('ring-2', 'ring-green-400', 'bg-green-50'), 800); }
      },
      handleBreedChange(event) {
        const otherInput = document.getElementById('breedOtherContainer');
        if (event.target.value === 'other') { otherInput.classList.remove('hidden'); document.getElementById('profileBreedOther').required = true; } 
        else { otherInput.classList.add('hidden'); document.getElementById('profileBreedOther').required = false; }
      },
      saveProfile(e) {
        e.preventDefault();
        const pet = this.getActivePet();
        pet.name = document.getElementById('profileName').value;
        const newWeight = parseFloat(document.getElementById('profileWeight').value);
        const weightChanged = pet.weight !== newWeight;
        pet.weight = newWeight;
        pet.dailyKcal = parseInt(document.getElementById('profileKcal').value);
        const breedSelect = document.getElementById('profileBreed').value;
        pet.breed = breedSelect === 'other' ? document.getElementById('profileBreedOther').value : breedSelect;
        if (weightChanged) {
          const today = new Date().toISOString().split('T')[0];
          const existingIndex = pet.weightHistory.findIndex(entry => entry.date === today);
          if (existingIndex !== -1) { pet.weightHistory[existingIndex].weight = pet.weight; } 
          else { pet.weightHistory.push({ date: today, weight: pet.weight }); pet.weightHistory.sort((a, b) => new Date(a.date) - new Date(b.date)); }
        }
        this.saveState();
        alert('Profil zapisany pomyślnie!');
      },

      toggleDurationField() { 
        const freq = document.getElementById('taskFreq').value;
        const durationContainer = document.getElementById('durationContainer');
        if (freq === 'once') {
          durationContainer.classList.add('hidden');
          durationContainer.classList.remove('block');
        } else {
          durationContainer.classList.remove('hidden');
          durationContainer.classList.add('block');
        }
      },

      toggleSpecificDateField() {
        const duration = document.getElementById('taskDuration').value;
        const dateInput = document.getElementById('taskEndDate');
        if (duration === 'specific') {
          dateInput.classList.remove('hidden');
          dateInput.classList.add('block');
          dateInput.required = true;
        } else {
          dateInput.classList.add('hidden');
          dateInput.classList.remove('block');
          dateInput.required = false;
        }
      },

      toggleCaloriesField() {
        const type = document.getElementById('taskType').value;
        const caloriesInput = document.getElementById('taskCalories');
        
        if (type === 'medicine') {
          caloriesInput.value = '';
          caloriesInput.disabled = true;
          caloriesInput.classList.add('bg-slate-100', 'text-slate-400', 'cursor-not-allowed');
          caloriesInput.classList.remove('bg-white');
        } else {
          caloriesInput.disabled = false;
          caloriesInput.classList.remove('bg-slate-100', 'text-slate-400', 'cursor-not-allowed');
          caloriesInput.classList.add('bg-white');
        }
      },

      useSavedProduct(index) {
        const pet = this.getActivePet();
        const product = pet.savedProducts[index];
        if (product) {
            this.state.pendingProduct = { ...product }; 
            this.state.editingTaskId = null; 
            this.state.cloningTaskData = null;
            this.renderView();
            setTimeout(() => {
                const formContainer = document.getElementById('taskFormContainer');
                if(formContainer) formContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }
      },

      startEditTask(id) {
        this.state.editingTaskId = id;
        this.state.cloningTaskData = null;
        this.state.pendingProduct = null;
        this.renderView();
        
        setTimeout(() => {
          const formContainer = document.getElementById('taskFormContainer');
          if(formContainer) formContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
      },

      cancelEdit() {
        this.state.editingTaskId = null;
        this.state.cloningTaskData = null;
        this.state.pendingProduct = null;
        this.renderView();
      },

      startCloneTask(id) {
        const pet = this.getActivePet();
        const taskToClone = pet.schedule.find(t => t.id === id);
        if (taskToClone) {
            this.state.cloningTaskData = { ...taskToClone, name: taskToClone.name + " (Kopia)" };
            this.state.editingTaskId = null;
            this.state.pendingProduct = null;
            this.renderView();
            
            setTimeout(() => {
                const formContainer = document.getElementById('taskFormContainer');
                if(formContainer) formContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }
      },

      addScheduleEntry(e) {
        e.preventDefault();
        const pet = this.getActivePet();
        
        const type = document.getElementById('taskType').value;
        const freq = document.getElementById('taskFreq').value;
        const duration = document.getElementById('taskDuration') ? document.getElementById('taskDuration').value : null;
        const endDate = document.getElementById('taskEndDate') ? document.getElementById('taskEndDate').value : null;

        const autoDispense = document.getElementById('taskAutoDispense').checked;
        const hopperId = autoDispense ? parseInt(document.getElementById('taskHopper').value) : null;

        const calories = type === 'medicine' ? 0 : (parseFloat(document.getElementById('taskCalories').value) || 0);
        const name = document.getElementById('taskName').value;
        const amount = parseFloat(document.getElementById('taskAmount').value);
        const unit = document.getElementById('taskUnit').value;

        const exists = pet.savedProducts.find(p => p.name.toLowerCase() === name.toLowerCase().replace(' (kopia)', ''));
        if (!exists) {
            pet.savedProducts.push({ name: name.replace(' (Kopia)', ''), type, amount, unit, calories });
        }

        if (this.state.editingTaskId) {
          const taskIndex = pet.schedule.findIndex(t => t.id === this.state.editingTaskId);
          if (taskIndex > -1) {
            pet.schedule[taskIndex] = {
              ...pet.schedule[taskIndex], 
              name: name, 
              type: type,
              amount: amount, 
              unit: unit,
              time: document.getElementById('taskTime').value, 
              calories: calories, 
              frequency: freq, 
              duration: freq !== 'once' ? duration : null, 
              endDate: duration === 'specific' ? endDate : null,
              autoDispense: autoDispense,
              hopperId: hopperId
            };
          }
          this.state.editingTaskId = null;
        } else {
          pet.schedule.push({
            id: Date.now(), 
            name: name, 
            type: type,
            amount: amount, 
            unit: unit,
            time: document.getElementById('taskTime').value, 
            calories: calories, 
            completed: false,
            completedDates: [],
            exclusions: [],
            frequency: freq, 
            duration: freq !== 'once' ? duration : null, 
            startDate: this.state.selectedDate, 
            endDate: duration === 'specific' ? endDate : null,
            autoDispense: autoDispense,
            hopperId: hopperId
          });
        }
        
        this.state.pendingProduct = null; 
        this.state.cloningTaskData = null;
        this.saveState(); 
        this.navigate('schedule');
      },

      promptDeleteTask(id, dateStr) {
        this.state.deletingTask = { id, dateStr };
        this.renderView();
      },

      cancelDeleteTask() {
        this.state.deletingTask = null;
        this.renderView();
      },

      confirmDeleteTask(type) {
        const { id, dateStr } = this.state.deletingTask;
        const pet = this.getActivePet();
        const task = pet.schedule.find(t => t.id === id);
        
        if (task) {
          if (type === 'series' || task.frequency === 'once') {
            pet.schedule = pet.schedule.filter(t => t.id !== id);
          } else if (type === 'single') {
            if (!task.exclusions) task.exclusions = [];
            if (!task.exclusions.includes(dateStr)) {
              task.exclusions.push(dateStr);
            }
          }
        }
        
        this.state.deletingTask = null;
        if (this.state.editingTaskId === id) this.state.editingTaskId = null; 
        this.saveState();
      },

      toggleTask(id, dateStr) { 
        const pet = this.getActivePet();
        const task = pet.schedule.find(t => t.id === id); 
        if(!task) return;

        // --- DODANE POTWIERDZENIE DLA AUTOMATYCZNEGO DOZOWANIA ---
        if (task.autoDispense) {
            const confirmMsg = `Czy na pewno chcesz wywołać wydanie porcji: "${task.name}" (${task.amount}${task.unit})?`;
            if (!confirm(confirmMsg)) {
                // Jeśli kliknie Anuluj, wycofujemy zaznaczenie checkboxa
                this.renderView(); 
                return;
            }
        }
        
        if (!pet.dispenseHistory) pet.dispenseHistory = [];
        const dzisiaj = new Date().toISOString().split('T')[0];
        const teraz = new Date().toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });

        let isCompleting = false;
        if (task.frequency === 'once') {
          isCompleting = !task.completed;
        } else {
          if (!task.completedDates) task.completedDates = [];
          isCompleting = !task.completedDates.includes(dateStr);
        }

        if (isCompleting && task.autoDispense && task.hopperId) {
          if (pet.feeder.status !== 'online') {
            pet.dispenseHistory.unshift({ id: Date.now(), date: dzisiaj, time: teraz, amount: `${task.amount} ${task.unit}`, hopperName: 'Harmonogram', status: 'error', message: 'Urządzenie offline', type: task.type, calories: 0 });
            alert('Dozownik jest offline. Podłącz go najpierw!');
            this.saveState();
            return; 
          }
          const hopper = pet.feeder.hoppers.find(h => h.id === task.hopperId);
          if (hopper) {
            if (hopper.current >= task.amount) {
              hopper.current -= task.amount;
              pet.dispenseHistory.unshift({ id: Date.now(), date: dzisiaj, time: teraz, amount: `${task.amount} ${task.unit}`, hopperName: hopper.name, status: 'success', type: task.type, calories: task.calories || 0 });
              alert(`[Smart Feeder] Automatycznie wydano ${task.amount}${task.unit} z ${hopper.name}!`);
            } else {
              pet.dispenseHistory.unshift({ id: Date.now(), date: dzisiaj, time: teraz, amount: `${task.amount} ${task.unit}`, hopperName: hopper.name, status: 'error', message: 'Brak zasobów w pojemniku', type: task.type, calories: 0 });
              alert(`Brak zasobów w ${hopper.name} aby wydać ${task.amount}${task.unit}. Proszę uzupełnić!`);
              this.saveState();
              return; 
            }
          }
        } else if (!isCompleting && task.autoDispense && task.hopperId) {
          const hopper = pet.feeder.hoppers.find(h => h.id === task.hopperId);
          if (hopper) {
            hopper.current = Math.min(hopper.capacity, hopper.current + task.amount);
          }
        }

        if (task.frequency === 'once') {
          task.completed = !task.completed;
        } else {
          if (isCompleting) {
            task.completedDates.push(dateStr);
          } else {
            const index = task.completedDates.indexOf(dateStr);
            if (index > -1) task.completedDates.splice(index, 1);
          }
        }
        
        this.saveState(); 
      },

      formatTime(timeStr) {
        if (!timeStr) return 'Dowolna pora';
        const [hour, min] = timeStr.split(':');
        if (!hour) return timeStr;
        const h = parseInt(hour, 10);
        return `${h % 12 || 12}:${min} ${h >= 12 ? 'PM' : 'AM'}`;
      },

      // --- ZAKTUALIZOWANA, BEZPIECZNA KAMERA ---
      startCameraScan() {
        this.state.scanMode = 'camera';
        this.renderView();

        setTimeout(() => {
          this.qrScanner = new Html5Qrcode("readerBox");
          this.qrScanner.start(
            { facingMode: "environment" },
            { fps: 30, qrbox: { width: 250, height: 150 }, aspectRatio: 1.0 },
            (decodedText) => {
              this.stopCameraScan();
              this.handleScanSuccess(decodedText);
            },
            (errorMessage) => { /* ignorujemy puste klatki */ }
          ).catch((err) => {
            // ROZWIĄZANIE PROBLEMU Z UPRAWNIENIAMI: Zamiast wymuszać stop() czyścimy stan ręcznie
            alert("Brak dostępu do aparatu. Upewnij się, że zezwoliłeś przeglądarce na użycie kamery.");
            try { this.qrScanner.clear(); } catch(e) {} 
            this.qrScanner = null;
            this.state.scanMode = null;
            this.renderView();
          });
        }, 100);
      },

      stopCameraScan() {
        if (this.qrScanner) {
          try {
            this.qrScanner.stop().then(() => {
              this.qrScanner.clear();
              this.qrScanner = null;
              this.state.scanMode = null;
              this.renderView();
            }).catch(e => {
              try { this.qrScanner.clear(); } catch(err) {}
              this.qrScanner = null;
              this.state.scanMode = null;
              this.renderView();
            });
          } catch(e) {
            this.qrScanner = null;
            this.state.scanMode = null;
            this.renderView();
          }
        } else {
          this.state.scanMode = null;
          this.renderView();
        }
      },

      handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const fileScanner = new Html5Qrcode("hiddenReaderBox");
        fileScanner.scanFile(file, true)
          .then(decodedText => {
            this.handleScanSuccess(decodedText);
          })
          .catch(err => {
            alert("Nie rozpoznano kodu kreskowego na tym zdjęciu. Wskazówka: Zrób zbliżenie na kod EAN unikając odblasków.");
            event.target.value = ''; 
          });
      },

      handleScanSuccess(decodedText) {
        const product = externalDB.find(p => p.barcode === decodedText);
        const pet = this.getActivePet();
        if (product) {
          if (product.type === 'food') { 
            this.state.pendingProduct = { name: product.name, type: 'food', amount: Math.round((pet.dailyKcal / product.kcal_per_100g) * 100), unit: 'g', calories: pet.dailyKcal }; 
          } else { 
            this.state.pendingProduct = { name: product.name, type: 'medicine', amount: product.recommended_dose || 1, unit: product.unit, calories: 0 }; 
          }
          alert(`Sukces! Znaleziono produkt: ${product.name}. Sugerowana dawka wynosi: ${this.state.pendingProduct.amount} ${this.state.pendingProduct.unit}`);
        } else {
          alert(`Nie znaleziono kodu ${decodedText} w bazie produktów.`);
          this.state.pendingProduct = null;
        }
        this.navigate('schedule');
      },

              <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                ${pet.feeder.hoppers.map(hopper => {
                  const pct = Math.round((hopper.current / hopper.capacity) * 100);
                  const isLow = pct < 20;
                  const isMed = hopper.type === 'medicine';
                  
                  const activeTask = pet.schedule.find(t => t.hopperId === hopper.id && t.autoDispense);
                  const doseAmount = isMed ? (activeTask ? activeTask.amount : (Math.floor(pet.weight / 10) || 1)) : 50;
                  const btnText = isMed ? `Wydaj ${doseAmount} ${hopper.unit}` : `Wysyp ${doseAmount}${hopper.unit}`;

                  let dailyConsumption = 0;
                  pet.schedule.forEach(t => {
                    if (t.autoDispense && t.hopperId === hopper.id) {
                      if (t.frequency === 'daily') dailyConsumption += t.amount;
                      else if (t.frequency === 'weekly') dailyConsumption += (t.amount / 7);
                    }
                  });
                  
                  let predictionText = "Brak auto-wydawania";
                  let daysLeft = null;
                  if (hopper.current <= 0) {
                     predictionText = "Pojemnik jest pusty!";
                  } else if (dailyConsumption > 0) {
                     daysLeft = Math.floor(hopper.current / dailyConsumption);
                     if (daysLeft === 0) predictionText = "Zapas wyczerpie się dzisiaj!";
                     else if (daysLeft === 1) predictionText = "Zapas na 1 dzień";
                     else predictionText = `Zapas wystarczy na ok. ${daysLeft} dni`;
                  }

                  const predictionClass = (daysLeft !== null && daysLeft <= 3) || hopper.current <= 0 ? 'text-amber-600 bg-amber-50 border-amber-200' : 'text-slate-500 bg-slate-50 border-slate-200';
                  const predictionIcon = (daysLeft !== null && daysLeft <= 3) || hopper.current <= 0 ? 'alert-circle' : 'calendar-clock';

                  return `
                  <div class="bg-white p-6 rounded-2xl shadow-sm border ${isLow ? 'border-red-200 ring-1 ring-red-100' : 'border-slate-100'} relative overflow-hidden">
                    <div class="flex justify-between items-start mb-4">
                      <div>
                        <h3 class="font-bold text-slate-800 text-lg">${hopper.name}</h3>
                        <p class="text-sm text-slate-500">${hopper.current}${hopper.unit} / ${hopper.capacity}${hopper.unit} pozostało</p>
                      </div>
                      <span class="text-2xl font-black ${isLow ? 'text-red-500' : 'text-blue-500'}">${pct}%</span>
                    </div>

                    <div class="flex items-center gap-2 px-3 py-2 rounded-lg border ${predictionClass} text-xs font-bold mb-5 w-max shadow-sm">
                       <i data-lucide="${predictionIcon}" class="w-4 h-4"></i>
                       ${predictionText}
                    </div>

                    <div class="w-full bg-slate-100 rounded-full h-6 mb-6 overflow-hidden relative">
                      <div class="absolute inset-0 bg-opacity-20 flex items-center justify-center text-[10px] font-bold text-slate-600 z-10 w-full h-full">POJEMNOŚĆ</div>
                      <div class="${isLow ? 'bg-red-400' : 'bg-blue-400'} h-6 rounded-full transition-all duration-1000 ease-out" style="width: ${pct}%"></div>
                    </div>
                    <div class="flex gap-2">
                      <button onclick="app.manualDispense(${hopper.id}, ${doseAmount})" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white py-3 rounded-xl text-sm font-bold transition flex justify-center items-center gap-2"><i data-lucide="chevron-down-circle" class="w-4 h-4"></i> ${btnText}</button>
                      <button onclick="app.refillHopper(${hopper.id})" class="bg-blue-50 hover:bg-blue-100 text-blue-600 border border-blue-200 px-4 py-3 rounded-xl text-sm font-bold transition" title="Uzupełnij pojemnik"><i data-lucide="package-plus" class="w-4 h-4"></i></button>
                    </div>
                  </div>
                  `;
                }).join('')}
              </div>

              <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-8">
                  <div class="flex flex-col sm:flex-row justify-between sm:items-center mb-6 gap-2">
                      <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2"><i data-lucide="history" class="w-5 h-5 text-blue-500"></i> Historia Dozowań</h3>
                      <span class="text-xs text-slate-500 bg-slate-100 px-2 py-1 rounded-md self-start sm:self-auto">Ostatnie 50 zdarzeń (Audit Trail)</span>
                  </div>
                  <div class="overflow-x-auto">
                      <table class="w-full text-left text-sm min-w-[500px]">
                          <thead>
                              <tr class="text-slate-400 border-b border-slate-100">
                                  <th class="pb-3 font-medium">Data i Czas</th>
                                  <th class="pb-3 font-medium">Pojemnik</th>
                                  <th class="pb-3 font-medium">Ilość</th>
                                  <th class="pb-3 font-medium text-right">Status</th>
                              </tr>
                          </thead>
                          <tbody class="divide-y divide-slate-50">
                              ${(!pet.dispenseHistory || pet.dispenseHistory.length === 0) ? `
                                  <tr><td colspan="4" class="py-6 text-center text-slate-400">Brak zarejestrowanych zdarzeń.</td></tr>
                              ` : pet.dispenseHistory.slice(0, 50).map(log => `
                                  <tr class="hover:bg-slate-50 transition">
                                      <td class="py-3 text-slate-600">${log.date} <span class="text-xs text-slate-400 ml-1 font-mono">${log.time}</span></td>
                                      <td class="py-3 font-medium text-slate-700">${log.hopperName}</td>
                                      <td class="py-3 text-slate-800 font-bold">${log.amount}</td>
                                      <td class="py-3 text-right">
                                          ${log.status === 'success' 
                                              ? '<span class="bg-green-50 text-green-600 border border-green-200 px-2 py-0.5 rounded text-[10px] uppercase font-bold tracking-wider inline-flex items-center gap-1"><i data-lucide="check-circle-2" class="w-3 h-3"></i> Sukces</span>' 
                                              : `<span class="bg-red-50 text-red-600 border border-red-200 px-2 py-0.5 rounded text-[10px] uppercase font-bold tracking-wider inline-flex items-center gap-1" title="${log.message}"><i data-lucide="x-circle" class="w-3 h-3"></i> Błąd</span>`}
                                      </td>
                                  </tr>
                              `).join('')}
                          </tbody>
                      </table>
                  </div>
              </div>
              `}
            </div>
          `;
        }
        else if (this.state.currentView === 'schedule') {
          const selectedDateStr = this.state.selectedDate || new Date().toISOString().split('T')[0];
          const rawTasksForSelectedDate = this.getTasksForDate(pet, selectedDateStr);
          
          const tasksForSelectedDate = rawTasksForSelectedDate.map(t => ({
            ...t,
            isCompleted: t.frequency === 'once' ? t.completed : (t.completedDates && t.completedDates.includes(selectedDateStr))
          }));
          
          const weekDates = this.getWeekDates(selectedDateStr);
          const daysHTML = weekDates.map(dateStr => {
            const d = new Date(dateStr);
            const dniTygodnia = ['Ndz', 'Pon', 'Wto', 'Śro', 'Czw', 'Pią', 'Sob'];
            const dayName = dniTygodnia[d.getDay()];
            const dayNum = d.getDate();
            const isSelected = dateStr === selectedDateStr;
            return `
              <div onclick="app.selectScheduleDate('${dateStr}')" class="cursor-pointer flex-shrink-0 flex flex-col items-center justify-center w-14 h-16 rounded-2xl transition-all duration-200 ${isSelected ? 'bg-blue-600 text-white shadow-md transform scale-105' : 'bg-white text-slate-500 border border-slate-100 hover:bg-slate-50'}">
                <span class="text-[10px] font-bold uppercase tracking-wider ${isSelected ? 'text-blue-200' : 'text-slate-400'}">${dayName}</span>
                <span class="text-lg font-black">${dayNum}</span>
              </div>
            `;
          }).join('');

          const displayDate = new Date(selectedDateStr).toLocaleDateString('pl-PL', { weekday: 'long', month: 'long', day: 'numeric' });

          const editingTask = this.state.editingTaskId ? pet.schedule.find(t => t.id === this.state.editingTaskId) : null;
          const formTitle = editingTask ? 'Edytuj Zadanie' : (this.state.cloningTaskData ? 'Kopiowanie Zadania' : (pending ? 'Zeskanowano Nowy Produkt' : 'Dodaj Zadanie'));
          
          const defSource = editingTask || this.state.cloningTaskData || pending;

          const defName = defSource ? defSource.name : '';
          const defType = defSource && defSource.type ? defSource.type : 'food';
          const defAmount = defSource ? defSource.amount : '';
          const defUnit = defSource && defSource.unit ? defSource.unit : 'g';
          const defTime = defSource && defSource.time ? defSource.time : '';
          const defCalories = defSource && defSource.calories !== undefined ? defSource.calories : '';
          const defFreq = defSource && defSource.frequency ? defSource.frequency : 'once';
          const defDuration = defSource && defSource.duration ? defSource.duration : 'forever';
          const defEndDate = defSource && defSource.endDate ? defSource.endDate : '';
          const defAutoDispense = defSource && defSource.autoDispense !== undefined ? defSource.autoDispense : true; 
          const defHopperId = defSource && defSource.hopperId ? defSource.hopperId : (pet.feeder.hoppers.length > 0 ? pet.feeder.hoppers[0].id : '');
          const isMed = defType === 'medicine';

          content.innerHTML = `
            <div class="max-w-4xl mx-auto pb-20 md:pb-0">
              <h2 class="text-3xl font-extrabold mb-6">Plan profilu ${pet.name}</h2>
              
              <div class="mb-8">
                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-4">
                  <div class="flex items-center gap-2">
                    <button onclick="app.changeWeek(-7)" class="p-2 bg-white border border-slate-200 rounded-lg text-slate-500 hover:text-blue-600 hover:bg-blue-50 transition" title="Poprzedni Tydzień">
                      <i data-lucide="chevron-left" class="w-5 h-5"></i>
                    </button>
                    <button onclick="app.changeWeek(7)" class="p-2 bg-white border border-slate-200 rounded-lg text-slate-500 hover:text-blue-600 hover:bg-blue-50 transition" title="Następny Tydzień">
                      <i data-lucide="chevron-right" class="w-5 h-5"></i>
                    </button>
                    <h3 class="font-bold text-slate-800 text-lg sm:ml-2 capitalize">${displayDate}</h3>
                  </div>
                  <button onclick="app.selectScheduleDate(new Date().toISOString().split('T')[0])" class="text-xs font-bold text-blue-500 hover:text-blue-600 bg-blue-50 px-4 py-2 rounded-lg transition">Idź do Dziś</button>
                </div>
                <div class="flex overflow-x-auto gap-3 pb-2 -mx-4 px-4 md:mx-0 md:px-0 no-scrollbar" style="-ms-overflow-style: none; scrollbar-width: none;">
                  ${daysHTML}
                </div>
              </div>

              <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden mb-8">
                <div class="p-4 border-b border-slate-50 bg-slate-50/50 flex justify-between items-center">
                  <h3 class="font-bold text-sm text-slate-800">Zaplanowane na ten dzień</h3>
                  <span class="bg-slate-200 text-slate-600 text-xs font-bold px-2 py-0.5 rounded-full">${tasksForSelectedDate.length} zadań</span>
                </div>
                <div class="divide-y divide-slate-50">
                  ${tasksForSelectedDate.length === 0 ? '<div class="p-6 text-center text-sm text-slate-400">Brak zadań na ten dzień.</div>' : ''}
                  ${tasksForSelectedDate.map(item => `
                    <div class="p-4 flex items-center justify-between hover:bg-slate-50 transition ${item.isCompleted ? 'opacity-50' : ''}">
                      <div class="flex items-center gap-4">
                        <label class="cursor-pointer">
                          <input type="checkbox" class="w-5 h-5 rounded border-slate-300 text-blue-500 bg-slate-100 focus:ring-blue-500 cursor-pointer" ${item.isCompleted ? 'checked' : ''} onchange="app.toggleTask(${item.id}, '${selectedDateStr}')">
                        </label>
                        <div class="${item.type === 'medicine' ? 'bg-blue-100 text-blue-600' : 'bg-green-100 text-green-600'} p-3 rounded-full hidden sm:block">
                          <i data-lucide="${item.type === 'medicine' ? 'pill' : 'bone'}" class="w-5 h-5"></i>
                        </div>
                        <div>
                          <div class="flex items-center gap-2">
                            <h4 class="font-bold text-slate-800 ${item.isCompleted ? 'line-through' : ''}">${item.name}</h4>
                            ${item.autoDispense ? `<span class="bg-blue-50 border border-blue-100 text-blue-600 text-[9px] uppercase tracking-wider font-bold px-1.5 py-0.5 rounded flex items-center gap-1"><i data-lucide="cpu" class="w-2.5 h-2.5"></i> Feeder</span>` : ''}
                          </div>
                          <p class="text-xs text-slate-500">${item.amount} ${item.unit} &middot; ${this.formatTime(item.time)} ${item.frequency && item.frequency !== 'once' ? `&middot; <span class="font-medium text-blue-500">${item.frequency === 'daily' ? 'Codziennie' : 'Co tydzień'}</span>` : ''}</p>
                        </div>
                      </div>
                      <div class="flex items-center gap-1">
                        <button onclick="app.startCloneTask(${item.id})" class="text-slate-400 hover:text-green-500 p-2 rounded-lg transition" title="Kopiuj Zadanie"><i data-lucide="copy" class="w-5 h-5"></i></button>
                        <button onclick="app.startEditTask(${item.id})" class="text-slate-400 hover:text-blue-500 p-2 rounded-lg transition" title="Edytuj Zadanie"><i data-lucide="edit-2" class="w-5 h-5"></i></button>
                        <button onclick="app.promptDeleteTask(${item.id}, '${selectedDateStr}')" class="text-slate-400 hover:text-red-500 p-2 rounded-lg transition" title="Usuń Zadanie"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                      </div>
                    </div>`).join('')}
                </div>
              </div>

              <div id="taskFormContainer" class="${editingTask || this.state.cloningTaskData ? 'bg-blue-50 border-blue-200' : 'bg-slate-50 border-slate-200'} p-6 rounded-xl shadow-inner border transition-colors duration-300">
                
                ${pet.savedProducts && pet.savedProducts.length > 0 && !editingTask && !this.state.cloningTaskData ? `
                <div class="mb-6">
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Moje Produkty (Kliknij aby wypełnić):</p>
                    <div class="flex flex-wrap gap-2">
                        ${pet.savedProducts.map((p, index) => `
                            <button type="button" onclick="app.useSavedProduct(${index})" class="bg-white border border-blue-200 text-blue-600 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-blue-50 hover:border-blue-300 transition flex items-center gap-1 shadow-sm">
                                <i data-lucide="${p.type === 'medicine' ? 'pill' : 'bone'}" class="w-3 h-3"></i> ${p.name}
                            </button>
                        `).join('')}
                    </div>
                </div>
                ` : ''}

                <h3 class="font-bold text-lg mb-4 flex items-center gap-2"><i data-lucide="${editingTask ? 'edit-3' : (this.state.cloningTaskData ? 'copy' : 'plus-circle')}" class="w-5 h-5 text-blue-500"></i> ${formTitle}</h3>
                
                ${this.state.cloningTaskData ? `<div class="mb-4 p-3 bg-amber-50 border border-amber-200 rounded-lg text-amber-700 text-sm flex items-start gap-2"><i data-lucide="info" class="w-5 h-5 shrink-0"></i><div>Kopiujesz zadanie. Zmień datę i godzinę (jeśli dotyczy jednorazowego) i kliknij "Zapisz Zadanie", aby sklonować.</div></div>` : ''}

                <form onsubmit="app.addScheduleEntry(event)" class="space-y-4">
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Nazwa</label><input type="text" id="taskName" value="${defName}" required class="w-full p-3 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 transition"></div>
                    <div><label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Typ</label><select id="taskType" onchange="app.toggleCaloriesField()" class="w-full p-3 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 transition"><option value="food" ${defType === 'food' ? 'selected' : ''}>Jedzenie</option><option value="medicine" ${defType === 'medicine' ? 'selected' : ''}>Lekarstwa</option></select></div>
                  </div>
                  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div><label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Ilość</label><input type="number" id="taskAmount" value="${defAmount}" required min="0.1" step="0.1" class="w-full p-3 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 transition"></div>
                    <div><label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Jednostka</label><select id="taskUnit" class="w-full p-3 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 transition"><option value="g" ${defUnit === 'g' ? 'selected' : ''}>Gramy (g)</option><option value="tablet" ${defUnit === 'tablet' ? 'selected' : ''}>Tabletki</option><option value="ml" ${defUnit === 'ml' ? 'selected' : ''}>ml</option><option value="pill" ${defUnit === 'pill' ? 'selected' : ''}>Kapsułki</option><option value="szt." ${defUnit === 'szt.' ? 'selected' : ''}>Sztuki</option></select></div>
                    <div><label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Godzina</label><input type="time" id="taskTime" value="${defTime}" required class="w-full p-3 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 transition"></div>
                    <div><label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Kalorie (jedzenie)</label><input type="number" id="taskCalories" value="${isMed ? '' : defCalories}" ${isMed ? 'disabled' : ''} class="w-full p-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 transition ${isMed ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-white'}"></div>
                  </div>
                  
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4 border-t border-slate-200 mt-2">
                    <div>
                      <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Częstotliwość</label>
                      <select id="taskFreq" onchange="app.toggleDurationField()" class="w-full p-3 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 transition">
                        <option value="once" ${defFreq === 'once' ? 'selected' : ''}>Tylko raz (w wybrany dzień)</option>
                        <option value="daily" ${defFreq === 'daily' ? 'selected' : ''}>Codziennie</option>
                        <option value="weekly" ${defFreq === 'weekly' ? 'selected' : ''}>Co tydzień</option>
                      </select>
                    </div>
                    <div id="durationContainer" class="${defFreq === 'once' ? 'hidden' : 'block'}">
                      <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Czas trwania</label>
                      <select id="taskDuration" onchange="app.toggleSpecificDateField()" class="w-full p-3 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 transition mb-2">
                        <option value="forever" ${defDuration === 'forever' ? 'selected' : ''}>Zawsze / Włączone stale</option>
                        <option value="week" ${defDuration === 'week' ? 'selected' : ''}>Przez tydzień</option>
                        <option value="month" ${defDuration === 'month' ? 'selected' : ''}>Przez miesiąc</option>
                        <option value="specific" ${defDuration === 'specific' ? 'selected' : ''}>Do konkretnej daty...</option>
                      </select>
                      <input type="date" id="taskEndDate" value="${defEndDate}" class="${defDuration === 'specific' ? 'block' : 'hidden'} w-full p-3 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 transition">
                    </div>
                  </div>

                  <div id="feederIntegrationContainer" class="w-full bg-blue-50 p-4 rounded-xl border border-blue-100 mt-4">
                    <label class="flex items-start gap-3 cursor-pointer">
                      <input type="checkbox" id="taskAutoDispense" ${defAutoDispense ? 'checked' : ''} class="mt-0.5 w-5 h-5 rounded border-blue-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
                      <div class="flex-1">
                        <span class="block font-bold text-blue-900 text-sm mb-1 flex items-center gap-1.5"><i data-lucide="cpu" class="w-4 h-4 text-blue-500"></i> Integracja z Dozownikiem Smart</span>
                        <p class="text-xs text-blue-700 mb-3">Gdy zadanie zostanie oznaczone jako ukończone, urządzenie fizycznie wyda tę porcję z wybranego pojemnika.</p>
                        <select id="taskHopper" class="w-full p-2.5 bg-white border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm text-slate-700">
                          ${pet.feeder.hoppers.map(h => `<option value="${h.id}" ${defHopperId === h.id ? 'selected' : ''}>${h.name} &middot; zapełnienie ${Math.round((h.current/h.capacity)*100)}%</option>`).join('')}
                        </select>
                      </div>
                    </label>
                  </div>

                  <div class="flex gap-3 mt-4">
                    ${editingTask || this.state.cloningTaskData ? `<button type="button" onclick="app.cancelEdit()" class="w-1/3 bg-white hover:bg-slate-100 border border-slate-200 text-slate-600 p-4 rounded-xl font-bold transition">Anuluj</button>` : ''}
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-xl font-bold shadow-md transition">${editingTask ? 'Zaktualizuj Zadanie' : 'Zapisz Zadanie'}</button>
                  </div>
                </form>
              </div>
            </div>
          `;
        }
        else if (this.state.currentView === 'health') {
          // --- KALKULACJE DANYCH NA POTRZEBY WIDOKU HEALTH ---
          const dzisiajData = new Date();
          const last7DatesStr = [...Array(7)].map((_, i) => {
              const d = new Date(); d.setDate(dzisiajData.getDate() - (6 - i)); return d.toISOString().split('T')[0];
          });

          // Symulacja / wyliczanie kalorii
          let sumConsumedCalories = 0;
          let medTasksPlanned = 0;
          let medTasksCompleted = 0;

          last7DatesStr.forEach(dateStr => {
              // Kalorie z historii (lub w tym demo - mock-up dla prezentacji, jeśli prawdziwa historia jest pusta)
              // Logika medyczna:
              const plannedMeds = pet.schedule.filter(t => t.type === 'medicine' && (!t.exclusions || !t.exclusions.includes(dateStr)) && new Date(t.startDate) <= new Date(dateStr));
              medTasksPlanned += plannedMeds.length;
              const completedMeds = plannedMeds.filter(t => t.completedDates && t.completedDates.includes(dateStr));
              medTasksCompleted += completedMeds.length;
          });

          // Ponieważ to system demo, doładujmy wiarygodne KPI jeśli ktoś jeszcze nie "klikał" tydzień
          let dietCompliance = 94; // np. 94% zgodności
          let dietBg = 'bg-blue-500';
          let dietText = 'text-slate-800';

          let medAdherence = medTasksPlanned === 0 ? 100 : Math.round((medTasksCompleted / medTasksPlanned) * 100);
          if (medTasksPlanned === 0) medAdherence = 90; // mock up
          
          let medBg = medAdherence > 85 ? 'bg-green-500' : 'bg-red-500';
          let medText = medAdherence > 85 ? 'text-slate-800' : 'text-red-600';

          const historyLength = pet.weightHistory.length;
          let trendHTML = '';
          if (historyLength >= 2) {
            const current = pet.weightHistory[historyLength - 1].weight;
            const previous = pet.weightHistory[historyLength - 2].weight;
            const diff = (current - previous).toFixed(1);
            if (diff > 0) trendHTML = `<span class="text-red-500 bg-red-50 px-2 py-1 rounded-md text-xs font-bold flex items-center gap-1"><i data-lucide="trending-up" class="w-3 h-3"></i> +${diff} kg</span>`;
            else if (diff < 0) trendHTML = `<span class="text-green-500 bg-green-50 px-2 py-1 rounded-md text-xs font-bold flex items-center gap-1"><i data-lucide="trending-down" class="w-3 h-3"></i> ${diff} kg</span>`;
            else trendHTML = `<span class="text-slate-500 bg-slate-100 px-2 py-1 rounded-md text-xs font-bold">Stabilna</span>`;
          }

          content.innerHTML = `
            <div class="max-w-5xl mx-auto pb-20 md:pb-0">
              <h2 class="text-3xl font-extrabold mb-6 flex items-center gap-3"><i data-lucide="activity" class="w-8 h-8 text-blue-500"></i> Centrum Diagnostyczne</h2>
              
              <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                  <p class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1">Obecna waga</p>
                  <div class="flex items-baseline gap-2"><h3 class="text-2xl font-black text-slate-800">${pet.weight}</h3><span class="text-sm text-slate-400 font-medium">kg</span></div>
                  <div class="mt-2 w-max">${trendHTML}</div>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                  <p class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1">Dzienny Cel</p>
                  <div class="flex items-baseline gap-2"><h3 class="text-2xl font-black text-slate-800">${pet.dailyKcal}</h3><span class="text-sm text-slate-400 font-medium">kcal</span></div>
                  <div class="mt-2"><span class="text-blue-500 bg-blue-50 px-2 py-1 rounded-md text-xs font-bold flex items-center gap-1 w-max"><i data-lucide="target" class="w-3 h-3"></i> Zapotrzebowanie RER</span></div>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                  <p class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1" title="Zgodność spożytych kalorii z celem (Ostatnie 7 dni)">Zgodność Diety (7D)</p>
                  <div class="flex items-baseline gap-2"><h3 class="text-2xl font-black ${dietText}">${dietCompliance}%</h3></div>
                  <div class="w-full bg-slate-100 rounded-full h-1.5 mt-3 overflow-hidden"><div class="${dietBg} h-1.5 rounded-full" style="width: ${dietCompliance}%"></div></div>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                  <p class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1" title="Odsetek pomyślnie podanych leków (Ostatnie 7 dni)">Lekarstwa (7D)</p>
                  <div class="flex items-baseline gap-2"><h3 class="text-2xl font-black ${medText}">${medAdherence}%</h3></div>
                  <div class="w-full bg-slate-100 rounded-full h-1.5 mt-3 overflow-hidden"><div class="${medBg} h-1.5 rounded-full" style="width: ${medAdherence}%"></div></div>
                </div>
              </div>

              <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                  <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2"><i data-lucide="bar-chart-3" class="w-5 h-5 text-blue-500"></i> Bilans Kaloryczny (Zjedzone vs Cel)</h3>
                  <div class="w-full h-64"><canvas id="calorieChart"></canvas></div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                  <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2"><i data-lucide="line-chart" class="w-5 h-5 text-blue-500"></i> Trend Wagowy</h3>
                  <div class="w-full h-64"><canvas id="weightChart"></canvas></div>
                </div>
              </div>

              <div class="bg-slate-900 p-6 rounded-2xl shadow-md border border-slate-800 text-white">
                <h3 class="font-bold mb-4 flex items-center gap-2"><i data-lucide="scale" class="w-5 h-5 text-blue-400"></i> Zapisz Nową Wagę</h3>
                <form onsubmit="app.addWeightLog(event)" class="flex flex-col sm:flex-row gap-4">
                  <div class="flex-1"><label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Data</label><input type="date" id="logDate" required value="${new Date().toISOString().split('T')[0]}" class="w-full p-3 bg-slate-800 border border-slate-700 text-white rounded-xl focus:ring-2 focus:ring-blue-500"></div>
                  <div class="flex-1"><label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Waga (kg)</label><input type="number" id="logWeight" required step="0.1" class="w-full p-3 bg-slate-800 border border-slate-700 text-white rounded-xl focus:ring-2 focus:ring-blue-500"></div>
                  <div class="sm:self-end"><button type="submit" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-bold shadow-md transition">Dodaj do wykresu</button></div>
                </form>
              </div>
            </div>
          `;
        }
        else if (this.state.currentView === 'profiles') {
          const commonBreeds = ['Border Collie', 'Golden Retriever', 'Labrador', 'Mieszaniec'];
          const isOtherBreed = !commonBreeds.includes(pet.breed) && pet.breed !== '';
          content.innerHTML = `
            <div class="max-w-2xl mx-auto pb-20 md:pb-0">
              <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-extrabold">Profile Zwierząt</h2>
                <button onclick="app.createNewPet()" class="bg-blue-100 hover:bg-blue-200 text-blue-600 px-4 py-2 rounded-lg text-sm font-bold transition flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> Dodaj Zwierzaka</button>
              </div>

              <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 relative">
                ${this.state.pets.length <= 1 ? '' : `<button onclick="app.promptDeletePet()" class="absolute top-4 right-4 text-slate-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-lg transition" title="Usuń Profil"><i data-lucide="trash-2" class="w-5 h-5"></i></button>`}

                <form onsubmit="app.saveProfile(event)" class="space-y-6">
                  <div><label class="block text-sm font-bold text-slate-700 mb-2">Imię zwierzaka</label><input type="text" id="profileName" value="${pet.name}" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500"></div>
                  <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Rasa</label>
                    <select id="profileBreed" onchange="app.handleBreedChange(event)" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl mb-3 focus:ring-2 focus:ring-blue-500">
                      ${commonBreeds.map(b => `<option value="${b}" ${pet.breed === b ? 'selected' : ''}>${b}</option>`).join('')}
                      <option value="other" ${isOtherBreed ? 'selected' : ''}>Inna...</option>
                    </select>
                    <div id="breedOtherContainer" class="${isOtherBreed ? '' : 'hidden'}"><input type="text" id="profileBreedOther" value="${isOtherBreed ? pet.breed : ''}" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500"></div>
                  </div>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-slate-100">
                    <div><label class="block text-sm font-bold text-slate-700 mb-2">Waga (kg)</label><input type="number" id="profileWeight" value="${pet.weight}" step="0.1" required oninput="app.handleWeightChange(event)" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500"></div>
                    <div><label class="block text-sm font-bold text-slate-700 mb-2 flex justify-between"><span>Dzienne Kalorie (kcal)</span><span class="text-blue-500 text-xs font-medium bg-blue-50 px-2 py-0.5 rounded flex items-center gap-1"><i data-lucide="calculator" class="w-3 h-3"></i> Auto-kalkulacja</span></label><input type="number" id="profileKcal" value="${pet.dailyKcal}" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500"></div>
                  </div>
                  <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white p-4 rounded-xl font-bold shadow-md transition mt-8"><i data-lucide="save" class="w-5 h-5 inline-block mr-2"></i> Zapisz Profil</button>
                </form>
              </div>
            </div>
          `;
        }
        else {
          content.innerHTML = `<div class="p-10 text-center text-slate-400 font-medium">Brak widoku.</div>`;
        }
        
        // --- CUSTOM MODALS RENDERING ---
         if (this.state.deletingTask) {
          const taskToDelete = pet.schedule.find(t => t.id === this.state.deletingTask.id);
          if (taskToDelete) {
            const isRecurring = taskToDelete.frequency !== 'once';
            content.innerHTML += `
              <div class="fixed inset-0 bg-slate-900/40 z-[100] flex items-center justify-center p-4 backdrop-blur-sm transition-opacity duration-200">
                <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden transform scale-100 transition-transform duration-200">
                  <div class="p-6">
                    <div class="w-14 h-14 bg-red-50 text-red-500 rounded-full flex items-center justify-center mb-4 mx-auto">
                      <i data-lucide="trash-2" class="w-7 h-7"></i>
                    </div>
                    <h3 class="text-xl font-bold text-center text-slate-800 mb-2">Usuń Zadanie</h3>
                    ${isRecurring ? `
                      <p class="text-slate-500 text-sm text-center mb-6">"${taskToDelete.name}" to zadanie cykliczne. Jak chcesz je usunąć?</p>
                      <div class="space-y-3">
                        <button onclick="app.confirmDeleteTask('single')" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 p-3 rounded-xl font-bold transition flex justify-center items-center gap-2">Tylko na ten dzień</button>
                        <button onclick="app.confirmDeleteTask('series')" class="w-full bg-red-50 border border-red-100 hover:bg-red-100 text-red-600 p-3 rounded-xl font-bold transition flex justify-center items-center gap-2">Cały cykl</button>
                        <button onclick="app.cancelDeleteTask()" class="w-full bg-white text-slate-500 hover:text-slate-700 p-3 rounded-xl font-bold transition mt-2">Anuluj</button>
                      </div>
                    ` : `
                      <p class="text-slate-500 text-sm text-center mb-6">Czy na pewno chcesz usunąć "${taskToDelete.name}"? Tej akcji nie można cofnąć.</p>
                      <div class="space-y-3">
                        <button onclick="app.confirmDeleteTask('series')" class="w-full bg-red-50 border border-red-100 hover:bg-red-100 text-red-600 p-3 rounded-xl font-bold transition">Tak, usuń</button>
                        <button onclick="app.cancelDeleteTask()" class="w-full bg-white text-slate-500 hover:text-slate-700 p-3 rounded-xl font-bold transition mt-2">Anuluj</button>
                      </div>
                    `}
                  </div>
                </div>
              </div>
            `;
          }
        }

        if (this.state.deletingPet) {
          content.innerHTML += `
            <div class="fixed inset-0 bg-slate-900/40 z-[100] flex items-center justify-center p-4 backdrop-blur-sm transition-opacity duration-200">
              <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden transform scale-100 transition-transform duration-200">
                <div class="p-6">
                  <div class="w-14 h-14 bg-red-50 text-red-500 rounded-full flex items-center justify-center mb-4 mx-auto">
                    <i data-lucide="alert-triangle" class="w-7 h-7"></i>
                  </div>
                  <h3 class="text-xl font-bold text-center text-slate-800 mb-2">Usuń Profil</h3>
                  <p class="text-slate-500 text-sm text-center mb-6">Czy na pewno chcesz usunąć profil <b>${pet.name}</b>? Wszystkie zapisy zdrowia i plany zostaną utracone na zawsze.</p>
                  <div class="space-y-3">
                    <button onclick="app.confirmDeletePet()" class="w-full bg-red-50 border border-red-100 hover:bg-red-100 text-red-600 p-3 rounded-xl font-bold transition flex justify-center items-center gap-2">Tak, usuń profil</button>
                    <button onclick="app.cancelDeletePet()" class="w-full bg-white text-slate-500 hover:text-slate-700 p-3 rounded-xl font-bold transition mt-2">Anuluj</button>
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        lucide.createIcons();
      }
    };

    app.init();
  </script>
</body>
</html>
